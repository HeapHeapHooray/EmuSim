[workspace]
resolver = "2"
members = [
    "crates/emusim-core",
    "crates/emusim-libretro",
    "crates/emusim-physics",
    "crates/emusim-audio",
    "crates/emusim-render",
    "crates/emusim-xr",
    "crates/emusim-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EmuSim Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.18", features = ["derive"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
libloading = "0.8"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.29"
wgpu = "0.20"
cpal = "0.15"
pollster = "0.3"
